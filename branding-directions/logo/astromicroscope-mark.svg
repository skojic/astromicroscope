<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <radialGradient id="sky" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#34539A"/>
      <stop offset=".55" stop-color="#1B2A72"/>
      <stop offset="1" stop-color="#0E1450"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#F6E3A1"/>
      <stop offset=".45" stop-color="#D4AF5C"/>
      <stop offset="1" stop-color="#A47E33"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#sky)"/>
  <g id="mark" fill="url(#gold)" stroke="url(#gold)">
    <!-- G bowl: Didone stress, thick on the left, hairline top and bottom -->
    <path stroke="none" d="M129.4 54 A52 60 0 1 0 122 152 L123 145 A34 52 0 1 1 127.9 60.2 Z"/>
    <!-- G beak serif -->
    <path stroke="none" d="M127 41 L135 39 L135 66 L127.5 62 Z"/>
    <!-- arm: forms the jaw of the G -->
    <path fill="none" stroke-width="9" stroke-linecap="round" d="M113 79 C141 84 147 128 118 146"/>
    <!-- tube and eyepiece -->
    <g transform="rotate(-32 99 84)">
      <rect stroke="none" x="93" y="62" width="12" height="36" rx="2"/>
      <rect stroke="none" x="90" y="57" width="18" height="6" rx="1.5"/>
      <rect stroke="none" x="95.5" y="98" width="7" height="9" rx="1"/>
    </g>
    <!-- coarse focus knob on the head -->
    <circle stroke="none" cx="114" cy="90" r="6"/>
    <!-- stage -->
    <rect stroke="none" x="82" y="121" width="56" height="6" rx="1.5"/>
    <!-- fine focus knob -->
    <circle stroke="none" cx="110" cy="143" r="5.5"/>
    <!-- base -->
    <path stroke="none" d="M84 152 H132 L136 164 H80 Z"/>
    <!-- sparkles -->
    <path stroke="none" d="M156 50 Q156 62 168 62 Q156 62 156 74 Q156 62 144 62 Q156 62 156 50 Z"/>
    <path stroke="none" d="M145 74 Q145 79 150 79 Q145 79 145 84 Q145 79 140 79 Q145 79 145 74 Z"/>
    <path stroke="none" d="M163 80 Q163 85 168 85 Q163 85 163 90 Q163 85 158 85 Q163 85 163 80 Z"/>
  </g>
</svg>
