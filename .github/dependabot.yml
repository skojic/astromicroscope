# Version updates (A6, D45). Security updates are separate and already on (D34). Minor and patch updates arrive as one grouped pull request
# per ecosystem and are merged by .github/workflows/dependabot-automerge.yml when site-ci is green; a major version is left for a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
