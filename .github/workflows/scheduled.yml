name: scheduled

# Checks that nobody has to remember (A4). A failing run emails the owner of the repository.
#   daily 05:17 UTC   smoke test of the deployed address
#   Monday 05:41 UTC  external links, dependency audit, Lighthouse on the deployed address
on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (specs/09 section 3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Smoke test (headers, languages, 404 pages, robots, sitemap)
        run: node site/scripts/smoke.mjs --mode preview
      - name: Crawl (status codes, canonicals, hreflang pairs, orphans)
        run: node site/scripts/crawl.mjs https://astromicroscope.filipvicentijevic99.workers.dev --mode preview

  weekly:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 5 * * 1'
    # ubuntu-24.04 pinned: Lighthouse needs a browser; ubuntu-26 lacks Chromium's libs and hangs on --with-deps (2026-11-04).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Dependency audit (what is shipped to visitors)
        run: npm audit --omit=dev --audit-level=high
      - name: External links of the built site
        run: npm run build && npm run test:links
      - name: Lighthouse on the deployed address (median of 3, mobile)
        run: npm run test:lighthouse:live
