# Preview of every pull request that touches the site, on Filip's Cloudflare account (M00-08, D16, D36).
# - Build is the non-production build: noindex, robots.txt Disallow (D24). The custom domain is never touched here.
# - D56: the preview is its OWN Worker, `astromicroscope-preview`, deployed with `wrangler deploy --name
#   astromicroscope-preview` (no Worker Previews, no custom domain, no routes). URL: https://astromicroscope-preview.<account subdomain>.workers.dev
#   Before 2026-11-07 this workflow used `wrangler preview`, which publishes branches of the PRODUCTION Worker: every
#   preview deploy overwrote the production build on astromicroscope.com, and the production address served the noindex
#   preview build. The smoke test below is the regression test: it must not pass on a preview build.
# - Needs two repository secrets, CLOUDFLARE_API_TOKEN (its own Account API token, limited to this account and to Workers,
#   not Srdjan's personal token) and CLOUDFLARE_ACCOUNT_ID. Without them (or on a pull request from a fork) the job
#   skips with a notice and the check stays green.
# - `pull_request`, not `pull_request_target`: a pull request from a fork never receives the secrets.
# - The preview Worker stays deployed (it is a single shared Worker, not one per pull request), so the "closed" cleanup
#   job is disabled (`if: false`): a closed pull request must not delete it. It is never a required check: a preview is a
#   convenience, not a gate.
name: site-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ['site/**', '.github/workflows/site-preview.yml', 'brand/tokens/**', 'brand/fonts/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that the Cloudflare secrets are available
        id: gate
        working-directory: . # runs before checkout, when site/ does not exist yet
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare secrets (not set yet, or a pull request from a fork): preview skipped."
          fi
      # Third-party actions are pinned to a full commit SHA (specs/09 section 3).
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      - name: Build (non-production, noindex)
        if: steps.gate.outputs.enabled == 'true'
        run: npm run build
      - name: Deploy the preview Worker
        id: preview
        if: steps.gate.outputs.enabled == 'true'
        env:
          # The Worker's runtime environment (D56): the preview address runs the preview build, the smoke test reads it.
          SITE_ENV: preview
        run: |
          set -euo pipefail
          # A separate Worker: never the production one, so astromicroscope.com keeps its production build.
          npx --no-install wrangler deploy --name astromicroscope-preview
          echo "url=https://astromicroscope-preview.filipvicentijevic99.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Smoke test of the preview Worker
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # The address is shared by every preview, so the comment may be the first deploy to a cold Worker: give it a
          # moment (the retries in the smoke test) and the URL still works.
          node scripts/smoke.mjs "https://astromicroscope-preview.filipvicentijevic99.workers.dev" --mode preview --retries 4
      - name: Comment the address on the pull request (one comment, updated)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker='<!-- site-preview -->'
          body="${marker}"$'\n'"**Pregled / Preview** (${SHA:0:7}): ${URL}/"$'\n\n'"Privremeni pregled, nije za pretraživače (noindex). Adresa je zajednička za sve PR-ove: prikazuje najnoviji pregled. / Temporary preview, not for search engines (noindex). The address is shared by every pull request: it shows the newest preview."
          id="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate --jq "[.[] | select(.body | contains(\"${marker}\"))][0].id // empty")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" > /dev/null
          fi

  cleanup:
    # Disabled on purpose: the preview is one shared Worker (`astromicroscope-preview`) for every pull request, so a
    # closed pull request must not delete it. `wrangler delete --name astromicroscope-preview --force` when the preview
    # is no longer needed.
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check that the Cloudflare secrets are available
        id: gate
        working-directory: . # runs before checkout, when site/ does not exist yet
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare secrets: nothing to delete."
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      - name: Delete the preview Worker
        if: steps.gate.outputs.enabled == 'true'
        run: npx --no-install wrangler delete --name astromicroscope-preview --force
