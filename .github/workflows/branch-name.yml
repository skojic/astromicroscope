# Checks that every pull request comes from a branch named
#   feature/<short-description>, fix/<short-description> or docs/<short-description>
# (lowercase letters, digits and hyphens). The check is required on main (see CONTRIBUTING.md and status/decisions.md).
# A wrong name fails the check; the run's summary says, in Serbian and English, how to move the changes to a branch with a
# valid name (CONTRIBUTING.md, step 2, has the full guide).
name: branch-name

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Dependabot opens its own branches (dependabot/...); they are reviewed like any other pull request.
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "Dependabot branch, name check skipped: $BRANCH"
            exit 0
          fi
          if [[ "$BRANCH" =~ ^(feature|fix|docs)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Branch name OK: $BRANCH"
            exit 0
          fi
          {
            echo "### ❌ Naziv grane nije ispravan · Branch name is not valid: \`$BRANCH\`"
            echo
            echo "**SR:** grana mora da se zove \`feature/…\`, \`fix/…\` ili \`docs/…\` (mala slova, cifre i crtice), npr. \`fix/prevod-footer\`. Prebaci izmene na novu granu (\`git switch -c fix/kratak-opis\`, \`git push -u origin fix/kratak-opis\`), otvori novi pull request i zatvori ovaj. Uputstvo: \`CONTRIBUTING.md\`, korak 2."
            echo
            echo "**EN:** the branch must be named \`feature/…\`, \`fix/…\` or \`docs/…\` (lowercase letters, digits and hyphens), e.g. \`fix/footer-translation\`. Move the changes to a new branch (\`git switch -c fix/short-description\`, \`git push -u origin fix/short-description\`), open a new pull request and close this one. Guide: \`CONTRIBUTING.md\`, step 2."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Branch name '$BRANCH' is not feature/…, fix/… or docs/… (lowercase, digits, hyphens). See the run summary."
          exit 1
