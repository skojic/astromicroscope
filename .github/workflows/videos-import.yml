name: videos-import

# Weekly: reads the channel feed (M11-01). When a new video appeared, the job builds and tests the site, then opens a pull
# request from a feature/ branch with auto-merge enabled (D45). GitHub merges it when `ci-gate` and `branch-name` are green,
# and that push to main triggers the deploy (site-deploy). The GitHub Actions app is not a bypass actor because this is a
# personal repository - GitHub only accepts the Actions app as a bypass actor on organisation-owned repositories - so the bot
# goes through a pull request instead of pushing to main directly (D45). Nothing new in the feed means nothing is committed.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      test_pr:
        description: 'Open a PR from an empty commit, to prove the bot may merge to main (ruleset bypass)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: videos-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # Third-party actions are pinned to a full commit SHA (specs/09 section 3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Read the channel feed
        run: npm run import:videos
      - name: Did anything change?
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- src/data/videos.json src/assets/videos)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- src/data/videos.json src/assets/videos
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new video in the feed."
          fi
      - name: Tests and build with the new data
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npm run build
          npm run test:html
          npx playwright install --with-deps chromium
          npm run test:seo
      - name: Open a pull request and enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "Srdjan Kojic"
          git config user.email "srdjan.m.kojic@gmail.com"
          git add src/data/videos.json src/assets/videos
          git commit -m "Videos: import the channel feed" -m "Weekly import of the channel feed (M11-01): new or changed videos and their thumbnails; tests, build, HTML validation and the SEO audit passed first."
          branch="feature/videos-import-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          git push -u origin "$branch"
          pr="$(gh pr create --base main --head "$branch" --title "Videos: import the channel feed" --body "Weekly import of the channel feed (M11-01). Auto-merge enabled: it merges when \`ci-gate\` and \`branch-name\` are green.")"
          gh pr merge --auto --squash "$pr"
          echo "Auto-merge enabled on $pr"
      - name: Test pull request (manual run only)
        if: github.event_name == 'workflow_dispatch' && inputs.test_pr
        run: |
          set -euo pipefail
          git config user.name "Srdjan Kojic"
          git config user.email "srdjan.m.kojic@gmail.com"
          git commit --allow-empty -m "CI: test that the Actions bot may merge to main"
          branch="feature/test-import-pr-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          git push -u origin "$branch"
          pr="$(gh pr create --base main --head "$branch" --title "CI: test bot merge to main" --body "Manual test (test_pr) that the Actions bot may merge to main without a human approval.")"
          gh pr merge --auto --squash "$pr"
          echo "Auto-merge enabled on $pr"