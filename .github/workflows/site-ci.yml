name: site-ci

# Every pull request and every push to main. `ci-gate` is the one check that branch protection requires (D45, D56):
# it is green when the job that had to run passed. The check is skipped when a change touches no site file, so docs-only
# changes are not blocked.
#
# D56 (2026-11-07): the job stays under 2 minutes. The full three-browser run took 9 min 20 s (run 42357555983), so the
# browser set went back to one (Chromium, one width per device class) and every check that duplicates another one is gone:
#   - the axe check, the e2e check and the layout check are one script (`scripts/visual.mjs`): one page load per page and
#     width, accessibility and interaction checked there, 'load' instead of 'networkidle';
#   - the production SEO audit is gone: the preview build is the same HTML, only robots.txt and the robots meta differ;
#   - the production build is gone: the production build runs on deploy (site-deploy), and the weekly Lighthouse runs on
#     the production site;
#   - Lighthouse runs in the weekly job, not on every change; on the deployed site it measures the real edge, not the
#     GitHub runner;
#   - the docs check stays as a fast local command (`npm run check:docs`), not a job.
# The "changes" job and "ci-gate" are one job: a job with a condition starts in about a minute, so the separate jobs
# were costing more than the work they guarded.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    name: ci-gate
    # ubuntu-24.04 pinned: the migrated ubuntu-26 image both hangs on `playwright install --with-deps` and lacks
    # Chromium's native libraries (2026-11-04, status/log.md).
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a full commit SHA (specs/09 section 3).
      # The file check runs before checkout, when site/ does not exist yet, so no working directory is set here; each
      # site step below sets its own.
      - name: Which files changed
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          files="site/" # default for a manual run, a new branch or a failed lookup: check everything
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')" || files="site/"
          elif [ "$EVENT" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename')" || files="site/"
          fi
          if printf '%s\n' "$files" | grep -E -q '^(site/|brand/tokens/|brand/fonts/|\.github/workflows/site-ci\.yml$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No site files in this change: unit tests, build and browser checks are skipped."
          fi
      - if: steps.files.outputs.site == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.files.outputs.site == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: steps.files.outputs.site == 'true'
        working-directory: site
        run: npm ci
      - name: Install Chromium
        if: steps.files.outputs.site == 'true'
        working-directory: site
        run: npx playwright install --with-deps chromium
      # The build comes first: it writes the Worker's generated module (the 404 pages and the spam paths, P07/D59) and
      # the unit tests import the Worker.
      - name: Build (content checks run first)
        if: steps.files.outputs.site == 'true'
        working-directory: site
        run: npm run build
      - name: Unit tests
        if: steps.files.outputs.site == 'true'
        working-directory: site
        run: npm test
      - name: HTML validation
        if: steps.files.outputs.site == 'true'
        working-directory: site
        run: npm run test:html
      # One browser check: accessibility (axe), skip link, phone menu, layout, video facade, zodiac lens (D56).
      - name: Browser checks (accessibility, layout, facade, lens)
        if: steps.files.outputs.site == 'true'
        working-directory: site
        run: npm run test:axe
      - name: SEO and link audit
        if: steps.files.outputs.site == 'true'
        working-directory: site
        run: npm run test:seo
