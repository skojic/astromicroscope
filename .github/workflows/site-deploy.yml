name: site-deploy

# D60 (2026-11-07, supersedes D36's preview part): every green push to main deploys straight to PRODUCTION
# (astromicroscope.com), the Worker `astromicroscope`. There is no preview stage any more: no per-pull-request preview,
# no second Worker and no manual dispatch. The pull request is reviewed and checked (`ci-gate`) before it is merged, and
# the merge is the release. A manual dispatch is a repair lever (deploy main again under the same gate); it is not
# `production: false` — a non-production build must never reach the custom domain.
on:
  workflow_run:
    workflows: [site-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy

jobs:
  deploy:
    # Only a push to main whose CI passed, never a pull request that happens to be named main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check the secrets and that this is the newest commit of main
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets: deploy skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$COMMIT" != "$latest" ]; then
            echo "::notice::$COMMIT is not the newest commit of main ($latest): its successor deploys."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      # Third-party actions are pinned to a full commit SHA (specs/09 section 3).
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        if: steps.gate.outputs.run == 'true'
        working-directory: site
        run: npm ci
      # SITE_ENV=production is both the assets build and the Worker's environment (D56): indexable pages, robots.txt
      # allows crawling and names the sitemap, and the API answers ('production'). The dry-run is the last check that the
      # configuration and the generated Worker module are right before the upload.
      - name: Build (production)
        if: steps.gate.outputs.run == 'true'
        working-directory: site
        run: |
          npm run build
          npx --no-install wrangler deploy --dry-run
        env:
          SITE_ENV: production
      - name: Deploy the Worker
        if: steps.gate.outputs.run == 'true'
        working-directory: site
        run: npx --no-install wrangler deploy
        env:
          SITE_ENV: production
      # The smoke test is the gate of the deploy: a production build on the custom domain (the environment header, no
      # noindex, robots.txt, sitemap, the 410 for a spam URL, the form endpoint). A red run is a failed release.
      - name: Smoke test of the production address
        if: steps.gate.outputs.run == 'true'
        working-directory: site
        run: node scripts/smoke.mjs https://astromicroscope.com --mode production
