name: site-deploy

# Deploys after site-ci passed on main, then runs the smoke test against it. No human, no personal token:
# the dedicated CI token of the repository secrets does it.
#   - Automatic runs (workflow_run after a green site-ci) build the temporary address as NON-production (noindex) — D36.
#   - A manual dispatch with `production: true` builds and deploys SITE_ENV=production to the CUSTOM domain astromicroscope.com (M13, D54/D55).
on:
  workflow_run:
    workflows: [site-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy the production build (SITE_ENV=production) to astromicroscope.com instead of the noindex preview"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: site-deploy

jobs:
  deploy:
    # Only a push to main whose CI passed, never a pull request that happens to be named main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Resolve deploy mode and newest commit
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets: deploy skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$COMMIT" != "$latest" ]; then
            echo "::notice::$COMMIT is not the newest commit of main ($latest): its successor deploys."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # Production only from a manual dispatch with the flag; automatic runs stay on the noindex preview (D36).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production }}" = "true" ]; then
            mode="production"
            url="https://astromicroscope.com"
          else
            mode="preview"
            url="https://astromicroscope.filipvicentijevic99.workers.dev"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Third-party actions are pinned to a full commit SHA (specs/09 section 3).
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        if: steps.gate.outputs.run == 'true'
        working-directory: site
        run: npm ci
      - name: "Build (${{ steps.gate.outputs.mode }})"
        if: steps.gate.outputs.run == 'true'
        working-directory: site
        run: npm run build
        env:
          SITE_ENV: ${{ steps.gate.outputs.mode == 'production' && 'production' || '' }}
      # SITE_ENV is the Worker's runtime environment too (D56): the API's own headers carry the Worker's environment, so a
      # preview build must run on the preview address and the production build on the custom domain. A mismatch makes the
      # smoke test fail with the build environment named.
      - name: Deploy the Worker
        if: steps.gate.outputs.run == 'true'
        working-directory: site
        run: npx --no-install wrangler deploy
        env:
          SITE_ENV: ${{ steps.gate.outputs.mode == 'production' && 'production' || '' }}
      - name: Smoke test of the deployed address
        if: steps.gate.outputs.run == 'true'
        working-directory: site
        run: node scripts/smoke.mjs "${{ steps.gate.outputs.url }}" --mode "${{ steps.gate.outputs.mode }}"
